[package]
edition = "2021"
name = "pup"
version = "0.3.0"
description = "Real-time multi-task computer vision with GStreamer and ONNX Runtime"
authors = ["Tarek Allam Jr <t.allam.jr@gmail.com>"]
license = "MIT"
repository = "https://github.com/tallamjr/pup"

[dependencies]
clap = { version = "4", features = ["derive"] }
gstreamer = "0.23.4"
gstreamer-video = "0.23.4"
gstreamer-app = "0.23.4"
ndarray = "0.16"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
opencv = "0.98.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2.7"
core-foundation = "0.9"
ort = { version = "2.0.0-rc.10", features = [ "download-binaries", "coreml" ] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
ort = { version = "2.0.0-rc.10", features = [ "download-binaries" ] }

[dev-dependencies]
tempfile = "3.8"
rand = "0.8"

# GStreamer plugin library
[lib]
name = "gstpup"
crate-type = ["rlib"]

[[bin]]
name = "pup"
path = "src/main.rs"

[profile.release]
codegen-units = 1   # Reduce number of codegen units to increase optimizations.
lto = true          # Enable Link Time Optimization
opt-level = "z"     # Optimize for size.
panic = "abort"     # Abort on panic
strip = true        # Automatically strip symbols from the binary.
